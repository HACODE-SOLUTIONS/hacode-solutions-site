<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A0B">
<meta name="description" content="HACODE Solutions command center. An isometric view of Outcomes as a Service: documents move through intake, AI processing, cloud validation, and delivery.">
<title>Command center · HACODE Solutions</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0b;
    --card: #121216;
    --line: rgba(255, 255, 255, 0.08);
    --text: #f4f1ff;
    --muted: #a39bb8;
    --violet: #8b5cf6;
    --violet-2: #c4b5fd;
    --good: #8ee0bc;
    --warn: #f5c16c;
    --bad: #f3a0a6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    color-scheme: dark;
  }
  body { min-height: 100dvh; }
  button, input { font: inherit; color: inherit; }
  button {
    background: #1b1b22;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    min-height: 36px;
    padding: 6px 12px;
    cursor: pointer;
    letter-spacing: 0.01em;
  }
  button:hover { border-color: rgba(196, 181, 253, 0.7); }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--violet-2);
    outline-offset: 2px;
  }
  button.primary { background: var(--violet); border-color: transparent; color: #fff; }
  button.primary:hover { background: #7c4fe0; }
  button.fix { border-color: rgba(245, 193, 108, 0.7); color: var(--warn); background: #241c12; }
  button[hidden], .reply[hidden] { display: none; }
  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background:
      radial-gradient(900px 420px at 20% -10%, rgba(139, 92, 246, 0.16), transparent 60%),
      var(--bg);
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 18px 6px;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand img { height: 40px; width: auto; display: block; }
  .mark {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .mark span {
    display: block;
    margin-top: 2px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    color: var(--muted);
  }
  h1 {
    margin: 2px 0 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #ddd6fe;
  }
  .pill {
    margin: 0;
    max-width: 420px;
    border: 1px solid rgba(196, 181, 253, 0.28);
    background: rgba(139, 92, 246, 0.12);
    color: #ede9fe;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
    line-height: 1.35;
  }
  .stage {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(320px, 400px);
    gap: 14px;
    padding: 4px 16px 16px;
  }
  .scene-wrap {
    position: relative;
    min-width: 0;
    min-height: 0;
    border-radius: 24px;
    border: 1px solid var(--line);
    background: #07070a;
    box-shadow: 0 24px 80px -36px rgba(139, 92, 246, 0.55);
    overflow: hidden;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 12px;
    margin: 0;
    padding: 8px 12px;
    border-radius: 12px;
    background: rgba(10, 10, 12, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.06);
    color: #e7e2f8;
    font-size: 13px;
    line-height: 1.35;
    pointer-events: none;
  }
  .side {
    min-height: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 12px;
  }
  .panel {
    border: 1px solid var(--line);
    background: rgba(18, 18, 22, 0.92);
    border-radius: 22px;
    padding: 10px 12px;
  }
  .panel-h {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: 0.01em; }
  .mode { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 99px;
    background: var(--good);
    box-shadow: 0 0 10px var(--good);
  }
  .dot.paused { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
  .dot.rush { background: var(--violet-2); box-shadow: 0 0 10px var(--violet); }
  .dot.reduced { background: #9aa0b4; box-shadow: none; }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .stat {
    margin: 0;
    padding: 8px 10px 7px;
    border-radius: 16px;
    background: #0c0c10;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .stat b {
    display: block;
    font-size: clamp(18px, 1.45vw, 26px);
    font-weight: 650;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .stat span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .hint { color: #7d7690; }
  .line, .meter, .note {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.35;
  }
  .line { color: #ddd6fe; }
  .chat {
    min-height: 0;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto fit-content(360px) minmax(96px, 1fr) auto;
    gap: 8px;
  }
  .chat .panel-h { margin: 0; }
  .thread {
    min-height: 0;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-right: 2px;
  }
  #pins {
    min-height: 0;
    overflow: auto;
    display: grid;
    gap: 8px;
    align-content: start;
    padding-right: 2px;
  }
  .card, .log {
    border-radius: 16px;
    border: 1px solid var(--line);
    background: #14141a;
    padding: 7px 10px 8px;
  }
  .card.warn { border-color: rgba(245, 193, 108, 0.45); }
  .card.bad { border-color: rgba(243, 160, 166, 0.5); }
  .card.good { border-color: rgba(142, 224, 188, 0.4); }
  .card.info { border-color: rgba(196, 181, 253, 0.35); }
  .card h3, .log-title { margin: 0; font-size: 14px; font-weight: 650; }
  .body, .log-body { margin: 3px 0 0; color: #d5d0e2; font-size: 13px; line-height: 1.35; }
  .status { margin: 4px 0 0; min-height: 1.15em; color: var(--violet-2); font-size: 12px; }
  .actions, .reply { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .reply input {
    flex: 1 1 140px;
    min-height: 40px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: #0c0c10;
    padding: 0 12px;
    color: white;
  }
  #feed {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .log-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .log time { color: #7d7690; font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .log.user { background: rgba(139, 92, 246, 0.16); margin-left: 12%; }
  .log.good { border-color: rgba(142, 224, 188, 0.28); }
  .log.warn { border-color: rgba(245, 193, 108, 0.28); }
  .log.bad { border-color: rgba(243, 160, 166, 0.32); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { flex: 1 1 calc(50% - 8px); }
  .card.flash { box-shadow: 0 0 0 1px rgba(196, 181, 253, 0.8), 0 0 28px -8px rgba(139, 92, 246, 0.9); }
  @media (prefers-reduced-motion: no-preference) {
    .dot.live { animation: pulse 2.4s ease-in-out infinite; }
    .thread { scroll-behavior: smooth; }
  }
  @media (prefers-reduced-motion: reduce) {
    .thread { scroll-behavior: auto; }
    .card.flash { animation: none; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  @media (min-width: 1600px) {
    .stage { grid-template-columns: minmax(0, 1fr) 440px; padding-left: 22px; padding-right: 22px; }
  }
  @media (max-width: 760px) {
    .top { flex-direction: column; align-items: flex-start; padding: 12px 14px 8px; }
    .pill { font-size: 12px; }
    .stage {
      display: flex;
      flex-direction: column;
      overflow: auto;
      gap: 10px;
      padding: 0 12px 16px;
    }
    .scene-wrap { height: min(52dvh, 440px); min-height: 260px; flex: none; }
    .side { display: flex; flex-direction: column; flex: none; }
    .app { height: auto; min-height: 100dvh; overflow: visible; }
    .chat { display: flex; flex-direction: column; overflow: visible; }
    #pins { overflow: visible; min-height: auto; }
    .thread { max-height: 420px; }
    .stat b { font-size: 22px; }
    button { min-height: 44px; }
  }
  @media (max-width: 420px) {
    .brand img { height: 32px; }
    .caption { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <img src="logo-on-dark.webp" alt="" width="36" height="42">
      <div>
        <p class="mark">HACODE <span>Solutions</span></p>
        <h1>Command center</h1>
      </div>
    </div>
    <p class="pill">AI-native service business · Outcomes as a Service</p>
  </header>
  <div class="stage">
    <div class="scene-wrap">
      <canvas id="scene" aria-describedby="caption"></canvas>
      <p class="caption" id="caption"></p>
    </div>
    <div class="side">
      <section class="panel stats" aria-label="Live outcomes">
        <div class="panel-h">
          <h2>Live outcomes</h2>
          <div class="mode"><span class="dot live" id="mode-dot"></span><span id="mode-label">Live</span></div>
        </div>
        <div class="stats-grid">
          <p class="stat"><b id="n-docs">0</b><span>Documents processed</span></p>
          <p class="stat"><b id="n-avg">0s</b><span>Avg processing time <span class="hint" id="n-avg-hint"></span></span></p>
          <p class="stat"><b id="n-saved">0 hrs</b><span>Time saved</span></p>
          <p class="stat"><b id="n-steps">0</b><span>Manual steps removed</span></p>
        </div>
        <p class="line" id="n-line"></p>
        <p class="meter" id="n-meter"></p>
        <p class="note" id="n-note"></p>
      </section>
      <section class="panel chat" aria-label="Activity">
        <div class="panel-h">
          <h2>Activity</h2>
          <span class="mode" id="n-log-count"></span>
        </div>
        <div id="pins"></div>
        <div class="thread" id="thread">
          <div id="feed" role="log" aria-relevant="additions"></div>
        </div>
        <div class="chips" id="chips">
          <button type="button" data-chip="rush">Rush the line</button>
          <button type="button" data-chip="hold">Hold for review</button>
          <button type="button" data-chip="fix">Fix flagged invoice</button>
          <button type="button" data-chip="pause">Pause line</button>
        </div>
      </section>
    </div>
  </div>
</div>
<noscript>The command center needs JavaScript to run the live pipeline.</noscript>
<script>
'use strict';
/**
 * One state graph drives the canvas, the stats, and the activity log.
 * Pipeline time is work-milliseconds. Speed changes elapsed; reduced motion
 * only slows the picture. Seed totals use the same formula as a live delivery.
 */
var MOVE = [700, 1000, 1000, 900];
var PROC = [900, 1100, 1000, 900];
var HAND = 650;
var REWIND = 900;
var NOM = HAND;
for (var si = 0; si < 4; si++) NOM += MOVE[si] + PROC[si];
var STEPS = 7;
var MANUAL_MIN = 18;
var RING = 24;
var SEED_N = 1284;
var RUSH_SPEED = 2.2;
var COS = Math.cos(Math.PI / 6);
var SIN = Math.sin(Math.PI / 6);
var PATH_N = 96;
var ST_SHORT = ['intake', 'AI', 'cloud', 'delivery'];
var ST_WIDE = ['Intake', 'AI processing', 'Cloud validation', 'Delivery'];
var ST_TALL = ['Intake', 'AI', 'Cloud', 'Delivery'];

var state = {
  paused: false,
  reduced: false,
  rushNext: false,
  rushLeft: 0,
  reviewNext: false,
  flagNext: false,
  docsProcessed: SEED_N,
  stepsRemoved: SEED_N * STEPS,
  savedMin: SEED_N * (MANUAL_MIN - NOM / 60000),
  docs: [],
  messages: [],
  statsRev: 1,
  sceneRev: 1,
  chipRev: 1,
  modeRev: 1
};
var recent = new Float64Array(RING);
var recentSum = 0;
var recentIdx = 0;
for (var ri = 0; ri < RING; ri++) {
  recent[ri] = NOM;
  recentSum += NOM;
}
var nextNum = 1043;
var flagDoc = null;
var reviewDoc = null;
var pool = [];
var sender = blankActor();
var receiver = blankActor();
sender.phase = 'toDrop';
sender.dur = 1.7;
sender.left = 1.7;
sender.carryNum = 1043;
sender.carryLabel = '#1043';
sender.wait = 0.4;
receiver.wait = 1.6;

var cssW = 0;
var cssH = 0;
var dpr = 1;
var unit = 40;
var originX = 0;
var originY = 0;
var tall = false;
var viewDirty = true;
var builtCache = false;
var stationU = new Float32Array(4);
var PATH = new Float32Array(PATH_N * 2);
var pocketX = new Float32Array(4);
var pocketY = new Float32Array(4);
var beltGx = new Float32Array(5);
var beltGy = new Float32Array(5);
var stGx = new Float32Array(4);
var stGy = new Float32Array(4);
var stations = [
  blankStation(0),
  blankStation(1),
  blankStation(2),
  blankStation(3)
];
var senderIdleX = 0, senderIdleY = 0, senderDropX = 0, senderDropY = 0;
var recvIdleX = 0, recvIdleY = 0, recvTakeX = 0, recvTakeY = 0;
var senderIdleGx = 0, senderIdleGy = 0, senderDropGx = 0, senderDropGy = 0;
var recvIdleGx = 0, recvIdleGy = 0, recvTakeGx = 0, recvTakeGy = 0;
var BOX = 1.28;
var BOXH = 1.08;
var fontLabel = '600 13px Inter, sans-serif';
var fontSmall = '600 11px Inter, sans-serif';
var floorCache = null;
var floorCtx = null;
var glowV, glowA, glowR, glowG;
var glowSprites;
var glowColors = ['#8B5CF6', '#F5C16C', '#F07178', '#7DDCB0'];
var docSprites = [];
var stepSmooth = 0;
var dashPhase = 0;
var visT = 0;
var scr = { x: 0, y: 0 };
var C = new Float32Array(16);
var TOP = new Float32Array(4 * 8);
var workRing = new Float64Array(120);
var workCount = 0;
var workIdx = 0;
var workSum = 0;
var workAvg = 0;
var frameIndex = 0;
var fpsShown = 0;
var fpsAcc = 0;
var fpsN = 0;
var lastNow = 0;
var lastMeter = 0;
var liveN = 0;
var lineText = '';
var captionText = '';
var sceneSeen = 0;
var statsSeen = 0;
var chipSeen = 0;
var modeSeen = 0;
var pressedEl = null;
var overInteractive = null;
var hitN = 0;
var HX = new Float32Array(10);
var HY = new Float32Array(10);
var HW = new Float32Array(10);
var HH = new Float32Array(10);
var HID = new Int16Array(10);
var cursorOn = false;
var handX = 0;
var handY = 0;
var EX = new Float32Array(12);
var EY = new Float32Array(12);
var ETYPE = new Int8Array(12);
var EID = new Int16Array(12);
var order = new Int8Array(12);

var wrap = document.querySelector('.scene-wrap');
var canvas = document.getElementById('scene');
var ctx = canvas.getContext('2d', { alpha: false });
var els = {
  docs: document.getElementById('n-docs'),
  avg: document.getElementById('n-avg'),
  avgHint: document.getElementById('n-avg-hint'),
  saved: document.getElementById('n-saved'),
  steps: document.getElementById('n-steps'),
  line: document.getElementById('n-line'),
  meter: document.getElementById('n-meter'),
  note: document.getElementById('n-note'),
  caption: document.getElementById('caption'),
  mode: document.getElementById('mode-label'),
  dot: document.getElementById('mode-dot'),
  count: document.getElementById('n-log-count'),
  feed: document.getElementById('feed'),
  thread: document.getElementById('thread'),
  pins: document.getElementById('pins'),
  chips: document.getElementById('chips')
};
var chipBtns = els.chips.querySelectorAll('button');

var flagMsg = {
  tone: 'bad',
  title: 'Invoice #1038 flagged',
  body: 'Vendor name unreadable. Held at AI processing.',
  status: 'Waiting for a fix.',
  showApprove: false,
  showSkip: false,
  showReply: false,
  showFix: true,
  replyOpen: false,
  focusReply: false
};
var reviewMsg = {
  tone: 'warn',
  title: 'Invoice #1042 needs review',
  body: 'Total does not match the purchase order.',
  status: 'Needs a decision.',
  showApprove: true,
  showSkip: true,
  showReply: true,
  showFix: false,
  replyOpen: false,
  focusReply: false
};
var cardFlag = buildCard('flag', flagMsg);
var cardReview = buildCard('review', reviewMsg);
els.pins.appendChild(cardFlag.root);
els.pins.appendChild(cardReview.root);

function blankActor() {
  return {
    phase: 'idle',
    left: 0.4,
    dur: 0.4,
    step: 0,
    eye: 1,
    blink: -1,
    wait: 2,
    happy: 0,
    carryNum: 0,
    carryLabel: ''
  };
}
function blankStation(i) {
  return { i: i, sx: 0, sy: 0, lx: 0, ly: 0, heat: 0, want: 0, mode: 0, wantMode: 0 };
}
function blankDoc() {
  return {
    dead: false,
    num: 0,
    kind: 'auto',
    label: '',
    phase: 'run',
    seg: 0,
    left: 0,
    dur: 1,
    u: 0,
    u0: 0,
    u1: 0,
    shift: 0,
    speed: 1,
    visual: 0,
    elapsed: 0,
    counted: false,
    note: '',
    noteShort: '',
    noteWidth: 0,
    fixed: false,
    approved: false,
    wantsFlag: false,
    wantsReview: false,
    holdStation: 0,
    times: true
  };
}
function takeDoc() {
  return pool.pop() || blankDoc();
}
function sumSegs(from, to) {
  var t = 0;
  for (var s = from; s <= to; s++) t += (s & 1) === 0 ? MOVE[s >> 1] : PROC[s >> 1];
  return t;
}
function bumpScene() { state.sceneRev++; }
function bumpChips() { state.chipRev++; }
function bumpMode() { state.modeRev++; }

function createHeld(num, kind, station) {
  var doc = takeDoc();
  doc.dead = false;
  doc.num = num;
  doc.kind = kind;
  doc.label = '#' + num;
  doc.phase = 'hold';
  doc.holdStation = station;
  doc.shift = 1;
  doc.speed = 1;
  doc.visual = kind === 'flag' ? 3 : 1;
  doc.elapsed = kind === 'review' ? sumSegs(0, 4) : 0;
  doc.counted = false;
  doc.fixed = false;
  doc.approved = false;
  doc.wantsFlag = kind === 'flag';
  doc.wantsReview = false;
  doc.note = '';
  doc.noteShort = '';
  doc.noteWidth = 0;
  doc.seg = station === 1 ? 3 : 5;
  doc.u = 0;
  doc.times = true;
  state.docs.push(doc);
  return doc;
}

flagDoc = createHeld(1038, 'flag', 1);
reviewDoc = createHeld(1042, 'review', 2);

function rnd() {
  return Math.random();
}
function clamp01(t) {
  if (t < 0) return 0;
  if (t > 1) return 1;
  return t;
}
function smooth(t) {
  t = clamp01(t);
  return t * t * (3 - 2 * t);
}
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function stamp() {
  var d = new Date();
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
}
function fmtInt(n) { return Math.round(n).toLocaleString('en-US'); }
function fmtSec(ms) { return (Math.round(ms / 100) / 10).toFixed(1) + 's'; }
function fmtHrs(min) { return (Math.round((min / 60) * 10) / 10).toFixed(1) + ' hrs'; }
function setText(node, text) {
  if (node && node.textContent !== text) node.textContent = text;
}
function modeKey() {
  if (state.paused) return 'paused';
  if (state.reduced) return 'reduced';
  if (rushing()) return 'rush';
  return 'live';
}
function modeLabel() {
  var k = modeKey();
  if (k === 'paused') return 'Paused';
  if (k === 'reduced') return 'Reduced motion';
  if (k === 'rush') return 'Rushing';
  return 'Live';
}
function rushing() {
  if (state.rushNext) return true;
  for (var i = 0; i < state.docs.length; i++) {
    var d = state.docs[i];
    if (!d.dead && d.speed > 1) return true;
  }
  return false;
}
function placeName(d) {
  if (d.phase === 'hold' && d.kind === 'flag') return 'flagged at AI';
  if (d.phase === 'hold') return 'waiting for review';
  if (d.phase === 'rewind') return 'heading back to intake';
  if (d.phase === 'skip') return 'leaving the line';
  if (d.phase === 'hand' || d.phase === 'fade') return 'at delivery';
  var st = d.seg >> 1;
  if (st > 3) st = 3;
  if ((d.seg & 1) === 0 && d.seg < 8) return 'heading to ' + ST_SHORT[st];
  return 'at ' + ST_SHORT[st];
}
function buildLine() {
  var n = 0;
  var s = '';
  for (var i = 0; i < state.docs.length; i++) {

      order[q + 1] = order[q];
      q--;
    }
    order[q + 1] = key;
  }
  hitN = 0;
  var scale = unit / 46;
  for (var e = 0; e < n; e++) {
    var id = order[e];
    if (ETYPE[id] === 0) drawSender(EX[id], EY[id], scale);
    else if (ETYPE[id] === 1) drawReceiver(EX[id], EY[id], scale);
    else drawDoc(state.docs[EID[id]], EX[id], EY[id]);
  }
  ctx.font = fontSmall;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  drawTag(EX[0], EY[0]);
  drawTag(EX[1], EY[1]);
}
function drawTag(x, y) {
  var top = y + Math.max(6, unit * 0.1);
  ctx.fillStyle = 'rgba(8, 8, 12, 0.82)';
  roundRect(ctx, x - 18, top, 36, 16, 8);
  ctx.fill();
  ctx.fillStyle = '#ddd6fe';
  ctx.fillText('You', x, top + 8);
}
function drawSender(x, y, scale) {
  var carry = sender.phase === 'toDrop' ? 1 : sender.phase === 'place' ? sender.left / sender.dur : 0;
  var reach = sender.phase === 'place' ? 1 - sender.left / sender.dur : 0;
  var face = sender.phase === 'toIdle' ? -1 : 1;
  var walking = sender.phase === 'toDrop' || sender.phase === 'toIdle' ? 1 : 0;
  drawPerson(x, y, scale, face, sender, carry, reach, walking);
  if (carry > 0.04) {
    drawPaper(handX + unit * 0.18, handY + unit * 0.16, unit * 0.5, 0, carry, sender.carryLabel, '');
  }
}
function drawReceiver(x, y, scale) {
  var reach = receiver.reach || 0;
  drawPerson(x, y, scale, -1, receiver, 0, reach, reach);
}
function drawPerson(x, y, scale, face, ch, carry, reach, walking) {
  var breath = state.reduced ? 0 : Math.sin(visT * 1.7 + (face > 0 ? 0 : 1.3)) * (1 - Math.min(1, walking)) * 1.15;
  var bob = breath + (walking > 0.2 ? Math.abs(Math.sin(ch.step * 6.283185)) * -2.5 : 0);
  var lean = state.reduced ? 0 : Math.sin(visT * 0.9 + ch.step) * (walking > 0.2 ? 0.4 : 1.3);
  personHand(x + lean, y, face, reach, carry, scale, bob);
  ctx.save();
  ctx.translate(x + lean, y);
  ctx.scale(scale * face, scale);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(0, 0, 16, 6, 0, 0, 6.283185);
  ctx.fill();
  var swing = Math.sin(ch.step * 6.283185) * (0.25 + Math.min(1, walking) * 0.75);
  ctx.strokeStyle = '#6d6484';
  ctx.lineWidth = 4.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-4, -24 + bob);
  ctx.lineTo(-3.5 + swing * 5, -1);
  ctx.moveTo(3.5, -24 + bob);
  ctx.lineTo(3.5 - swing * 5, -1);
  ctx.stroke();
  roundRect(ctx, -11, -46 + bob, 22, 24, 7);
  ctx.fillStyle = '#1b1726';
  ctx.fill();
  ctx.fillStyle = '#8B5CF6';
  roundRect(ctx, -11, -46 + bob, 22, 5.5, 3);
  ctx.fill();
  var hy = -40 + bob;
  var hx = 12 + reach * 12 + carry * 10;
  var hand = -34 + bob + reach * 14;
  ctx.strokeStyle = '#1b1726';
  ctx.lineWidth = 3.6;
  ctx.beginPath();
  ctx.moveTo(-8, hy);
  ctx.lineTo(-14 - swing * 6, -22 + bob);
  ctx.moveTo(8, hy);
  ctx.lineTo(hx, hand);
  ctx.stroke();
  ctx.fillStyle = '#f0c9a0';
  ctx.beginPath();
  ctx.arc(hx, hand, 2.4, 0, 6.283185);
  ctx.fill();
  var headY = -58 + bob;
  ctx.fillStyle = '#241833';
  ctx.beginPath();
  ctx.arc(0, headY - 1, 10.6, 0, 6.283185);
  ctx.fill();
  ctx.fillStyle = '#f0c9a0';
  ctx.beginPath();
  ctx.arc(0, headY + 2.4, 8.4, 0, 6.283185);
  ctx.fill();
  if (ch.eye < 0.22) {
    ctx.strokeStyle = '#3a241c';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-5.2, headY + 1.5);
    ctx.lineTo(-2.1, headY + 1.5);
    ctx.moveTo(2.1, headY + 1.5);
    ctx.lineTo(5.2, headY + 1.5);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#2a1a16';
    ctx.beginPath();
    ctx.ellipse(-3.5, headY + 1.4, 1.25, 1.65 * ch.eye, 0, 0, 6.283185);
    ctx.ellipse(3.5, headY + 1.4, 1.25, 1.65 * ch.eye, 0, 0, 6.283185);
    ctx.fill();
  }
  if (ch.happy > 0.08) {
    ctx.strokeStyle = '#8d5b48';
    ctx.lineWidth = 1.15;
    ctx.beginPath();
    ctx.arc(0, headY + 4.2, 3, 0.15, 3);
    ctx.stroke();
  }
  ctx.restore();
}
function drawDoc(doc, x, y) {
  var alpha = 1;
  if (doc.phase === 'fade' || doc.phase === 'skip') alpha = Math.max(0, doc.left / doc.dur);
  noteWidthCache = doc.noteWidth;
  drawPaper(x, y, unit * 0.9, doc.visual, alpha, doc.label, doc.noteShort);
  if (hitN < 10) {
    var dw = unit * 0.9;
    HX[hitN] = x - dw * 0.45;
    HY[hitN] = y - dw * 1.15;
    HW[hitN] = dw * 0.95;
    HH[hitN] = dw * 1.25;
    HID[hitN] = doc.num;
    hitN++;
  }
}
var noteWidthCache = 0;
function drawPaper(x, y, dw, visual, alpha, label, note) {
  var sprite = docSprites[visual] || docSprites[0];
  var dh = dw * (220 / 180);
  ctx.globalAlpha = alpha;
  ctx.drawImage(sprite, x - dw * 0.5, y - dh * 0.86, dw, dh);
  ctx.font = fontSmall;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2c261f';
  ctx.fillText(label, x - dw * 0.02, y - dh * 0.42);
  if (note) {
    ctx.font = fontSmall;
    var tw = noteWidthCache;
    var w = Math.min(dw * 1.6, tw + 16);
    ctx.fillStyle = 'rgba(20,16,32,0.92)';
    roundRect(ctx, x - w / 2, y - dh * 0.98, w, 18, 8);
    ctx.fill();
    ctx.fillStyle = '#efeaff';
    ctx.fillText(note, x, y - dh * 0.98 + 9);
  }
  ctx.globalAlpha = 1;
}
function hitAt(x, y) {
  for (var i = hitN - 1; i >= 0; i--) {
    if (x >= HX[i] && x <= HX[i] + HW[i] && y >= HY[i] && y <= HY[i] + HH[i]) return HID[i];
  }
  return -1;
}
function findDoc(num) {
  for (var i = 0; i < state.docs.length; i++) {
    if (!state.docs[i].dead && state.docs[i].num === num) return state.docs[i];
  }
  return null;
}

function onChip(name) {
  if (name === 'rush') onRush();
  else if (name === 'hold') onHoldChip();
  else if (name === 'fix') onFixChip();
  else if (name === 'pause') onPause();
}
function onRush() {
  var ids = [];
  for (var i = 0; i < state.docs.length; i++) {
    var d = state.docs[i];
    if (d.dead || d.phase === 'hold' || d.phase === 'skip' || d.phase === 'fade') continue;
    d.speed = RUSH_SPEED;
    ids.push(d.label);
  }
  state.rushNext = true;
  state.rushLeft = 12;
  if (ids.length === 0) pushFeed('info', 'The next invoice will be rushed', 'Intake will take it at ' + RUSH_SPEED + '× until the burst ends.');
  else if (ids.length === 1) pushFeed('info', 'Rushing invoice ' + ids[0], 'That document is moving at ' + RUSH_SPEED + '×.');
  else pushFeed('info', 'Rushing ' + ids.join(' and '), 'Those documents are moving at ' + RUSH_SPEED + '×.');
  bumpMode();
  bumpScene();
  bumpChips();
}
function onPause() {
  state.paused = !state.paused;
  if (state.paused) pushFeed('warn', 'Line paused', 'Documents hold their place until you resume.');
  else pushFeed('info', 'Line resumed', 'The pipeline is moving again.');
  bumpMode();
  bumpScene();
  bumpChips();
}
function onHoldChip() {
  if (reviewDoc && !reviewDoc.dead) {
    flashCard(cardReview);
    pushFeed('info', 'Invoice #' + reviewDoc.num + ' is the open review', reviewDoc.phase === 'hold'
      ? 'It is waiting at cloud validation.'
      : 'It is ' + placeName(reviewDoc) + '.');
    stations[2].heat = 1;
    return;
  }
  var target = null;
  for (var i = 0; i < state.docs.length; i++) {
    var d = state.docs[i];
    if (d.dead || d.kind === 'flag' || d.approved) continue;
    if (d.phase === 'run' && d.seg < 5) { target = d; break; }
  }
  if (target) {
    target.wantsReview = true;
    armReview(target, false);
    pushFeed('warn', 'Invoice #' + target.num + ' will stop for review', 'Cloud validation will hold it.');
    bumpScene();
    return;
  }
  state.reviewNext = true;
  bumpChips();
  pushFeed('warn', 'The next invoice will stop for review', 'It holds at cloud validation.');
}
function onFixChip() {
  if (flagDoc && !flagDoc.dead) {
    if (flagDoc.phase === 'hold' && !flagDoc.fixed) { startFix(flagDoc); return; }
    flashCard(cardFlag);
    pushFeed('info', 'Invoice #' + flagDoc.num + ' is already moving', 'It is ' + placeName(flagDoc) + '.');
    return;
  }
  var target = null;
  for (var i = 0; i < state.docs.length; i++) {
    var d = state.docs[i];
    if (d.dead || d === reviewDoc) continue;
    if (d.phase === 'run' && d.seg < 3 && !d.fixed) { target = d; break; }
  }
  if (target) {
    armFlag(target, false);
    pushFeed('bad', 'Invoice #' + target.num + ' will be flagged', 'AI processing will hold it.');
    bumpScene();
    return;
  }
  state.flagNext = true;
  bumpChips();
  pushFeed('bad', 'The next invoice will be flagged', 'AI processing will hold it for a fix.');
}
function startFix(doc) {
  doc.phase = 'rewind';
  doc.fixed = false;
  doc.dur = REWIND;
  doc.left = REWIND;
  doc.u0 = doc.u;
  doc.u1 = 0;
  doc.speed = state.rushNext ? RUSH_SPEED : 1;
  doc.times = true;
  doc.elapsed = 0;
  doc.shift = doc.shift || 0;
  flagMsg.tone = 'info';
  flagMsg.title = 'Invoice #' + doc.num + ' reprocessing';
  flagMsg.status = 'Reprocessing from intake.';
  flagMsg.showFix = false;
  cardFlag.dirty = true;
  pushFeed('info', 'Invoice #' + doc.num + ' is being fixed', 'It returns to intake, then runs the line again.');
  receiver.happy = 0;
  bumpChips();
  bumpScene();
}
function onAct(pin, act) {
  if (pin === 'flag' && act === 'fix') {
    if (flagDoc && flagDoc.phase === 'hold' && !flagDoc.fixed) startFix(flagDoc);
    return;
  }
  if (pin !== 'review' || !reviewDoc || reviewDoc.dead) return;
  if (act === 'approve') onApprove();
  else if (act === 'skip') onSkip();
  else if (act === 'reply') onReplyOpen();
}
function onApprove() {
  if (reviewDoc.phase !== 'hold') return;
  reviewDoc.approved = true;
  reviewDoc.wantsReview = false;
  reviewDoc.kind = 'review';
  reviewDoc.phase = 'run';
  reviewDoc.seg = 5;
  reviewDoc.speed = state.rushNext ? RUSH_SPEED : 1;
  reviewDoc.visual = 2;
  beginSeg(reviewDoc);
  reviewMsg.tone = 'good';
  reviewMsg.title = 'Invoice #' + reviewDoc.num + ' approved';
  reviewMsg.status = 'Approved. Sending through the remaining stations.';
  reviewMsg.showApprove = false;
  reviewMsg.showSkip = false;
  reviewMsg.showReply = false;
  reviewMsg.replyOpen = false;
  cardReview.dirty = true;
  pushFeed('good', 'Invoice #' + reviewDoc.num + ' approved', 'Cloud validation is finishing the pass.');
  bumpChips();
}
function onSkip() {
  if (reviewDoc.phase !== 'hold') return;
  var num = reviewDoc.num;
  reviewDoc.phase = 'skip';
  reviewDoc.dur = 520;
  reviewDoc.left = 520;
  reviewDoc.times = false;
  reviewDoc.holdStation = 2;
  reviewMsg.tone = 'info';
  reviewMsg.title = 'Invoice #' + num + ' skipped';
  reviewMsg.status = 'Skipped. Not counted as delivered.';
  reviewMsg.showApprove = false;
  reviewMsg.showSkip = false;
  reviewMsg.showReply = false;
  reviewMsg.replyOpen = false;
  cardReview.dirty = true;
  pushFeed('info', 'Invoice #' + num + ' skipped', 'It left the line and was not counted as delivered.');
  bumpChips();
  bumpScene();
}
function onReplyOpen() {
  if (reviewDoc.phase !== 'hold') return;
  reviewMsg.replyOpen = true;
  reviewMsg.focusReply = true;
  cardReview.dirty = true;
}
function onReply(text) {
  if (!reviewDoc || reviewDoc.phase !== 'hold') return;
  var trimmed = text.trim();
  if (!trimmed) return;
  reviewDoc.note = trimmed;
  reviewDoc.noteShort = trimmed.length > 32 ? trimmed.slice(0, 31) + '…' : trimmed;
  ctx.font = fontSmall;
  reviewDoc.noteWidth = ctx.measureText(reviewDoc.noteShort).width;
  reviewMsg.replyOpen = false;
  reviewMsg.status = 'Note attached. Still waiting for approve or skip.';
  cardReview.dirty = true;
  pushFeed('info', 'You replied on invoice #' + reviewDoc.num, trimmed, true);
  pushFeed('info', 'Note attached to invoice #' + reviewDoc.num, 'It stays in review until you approve or skip.');
  bumpScene();
}

function frame(now) {
  var t0 = performance.now();
  frameIndex++;
  if (viewDirty || frameIndex % 90 === 0) {
    var rw = wrap.clientWidth;
    var rh = wrap.clientHeight;
    var rd = Math.min(2, window.devicePixelRatio || 1);
    if (viewDirty || rw !== cssW || rh !== cssH || rd !== dpr) layout();
  }
  update(now);
  if (cssW > 2 && cssH > 2) draw();
  syncDom(now);
  var elapsed = performance.now() - t0;
  if (frameIndex > 20 && !builtCache) {
    /* cache flag is cleared below only on the layout frame */
  }
  if (frameIndex > 25 && !layoutThisFrame) {
    if (workCount < workRing.length) {
      workRing[workCount] = elapsed;
      workSum += elapsed;
      workCount++;
    } else {
      workSum -= workRing[workIdx];
      workRing[workIdx] = elapsed;
      workSum += elapsed;
      workIdx = (workIdx + 1) % workRing.length;
    }
    workAvg = workSum / workCount;
  }
  layoutThisFrame = false;
  var gap = lastGap ? (now - lastGap) / 1000 : 0;
  lastGap = now;
  if (frameIndex > 25 && gap > 0 && gap < 0.2) {
    fpsAcc += gap;
    fpsN++;
    if (fpsAcc >= 0.4 && fpsN > 4) {
      fpsShown = fpsN / fpsAcc;
      fpsAcc = 0;
      fpsN = 0;
    }
  }
  api.workMs = workAvg;
  api.fps = fpsShown;
  api.samples = workCount;
  requestAnimationFrame(frame);
}
var layoutThisFrame = false;
var lastGap = 0;
var layoutOrig = layout;
layout = function () {
  layoutThisFrame = true;
  layoutOrig();
};

var api = {
  state: state,
  NOM: NOM,
  STEPS: STEPS,
  MANUAL_MIN: MANUAL_MIN,
  RING: RING,
  workMs: 0,
  fps: 0,
  samples: 0,
  snapshot: function () {
    buildLine();
    return {
      docs: state.docsProcessed,
      avgMs: recentSum / RING,
      savedMin: state.savedMin,
      steps: state.stepsRemoved,
      live: liveN,
      line: lineText,
      paused: state.paused,
      reduced: state.reduced,
      rush: state.rushNext,
      messages: state.messages.length,
      workMs: workAvg,
      fps: fpsShown,
      flag: flagDoc ? flagDoc.num : 0,
      review: reviewDoc ? reviewDoc.num : 0,
      flagPhase: flagDoc ? flagDoc.phase : '',
      reviewPhase: reviewDoc ? reviewDoc.phase : ''
    };
  }
};
window.__HACODE_CC = api;

var logo = document.querySelector('.brand img');
logo.addEventListener('error', function () { logo.hidden = true; });
var motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
function applyMotion() {
  state.reduced = !!motionQuery.matches;
  bumpMode();
  bumpScene();
}
if (motionQuery.addEventListener) motionQuery.addEventListener('change', applyMotion);
else if (motionQuery.addListener) motionQuery.addListener(applyMotion);
state.reduced = !!motionQuery.matches;

document.addEventListener('pointerover', function (e) {
  overInteractive = e.target.closest ? e.target.closest('button, input, textarea') : null;
});
document.addEventListener('pointerout', function (e) {
  var t = e.target.closest ? e.target.closest('button, input, textarea') : null;
  if (t && overInteractive === t) overInteractive = null;
});
document.addEventListener('pointerdown', function (e) {
  pressedEl = e.target.closest ? e.target.closest('button, input, textarea') : null;
});
document.addEventListener('pointerup', function () { pressedEl = null; });
document.addEventListener('pointercancel', function () { pressedEl = null; });
document.body.addEventListener('click', function (e) {
  var chip = e.target.closest ? e.target.closest('[data-chip]') : null;
  if (chip) { onChip(chip.getAttribute('data-chip')); return; }
  var act = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!act) return;
  var pin = act.closest('[data-pin]');
  if (!pin) return;
  onAct(pin.getAttribute('data-pin'), act.getAttribute('data-act'));
});
els.pins.addEventListener('submit', function (e) {
  e.preventDefault();
  var input = e.target.querySelector ? e.target.querySelector('input') : null;
  if (!input) return;
  onReply(input.value);
  input.value = '';
});
canvas.addEventListener('pointermove', function (e) {
  var on = hitAt(e.offsetX, e.offsetY) >= 0;
  if (on !== cursorOn) {
    cursorOn = on;
    canvas.style.cursor = on ? 'pointer' : 'default';
  }
});
canvas.addEventListener('click', function (e) {
  var num = hitAt(e.offsetX, e.offsetY);
  if (num < 0) return;
  var doc = findDoc(num);
  if (!doc) return;
  if (doc === reviewDoc || doc.kind === 'review') flashCard(cardReview);
  else if (doc === flagDoc || doc.kind === 'flag') flashCard(cardFlag);
  else pushFeed('info', 'Following invoice #' + doc.num, 'It is ' + placeName(doc) + '.');
  stations[doc.phase === 'hold' ? doc.holdStation : Math.min(3, doc.seg >> 1)].heat = 1;
});
new ResizeObserver(function () { viewDirty = true; }).observe(wrap);

els.note.textContent = 'Each delivery replaces ' + STEPS + ' manual steps and ' + MANUAL_MIN + ' minutes of staff time. Average is the last ' + RING + ' outcomes.';
els.avgHint.textContent = 'last ' + RING;
pushFeed('info', 'Pipeline online', 'Intake, AI processing, cloud validation, delivery. No software handoff.');
pushFeed('info', 'Invoice #' + reviewDoc.num + ' received', 'Waiting at cloud validation.');
pushFeed('bad', 'Invoice #' + flagDoc.num + ' flagged', 'Vendor name unreadable at AI processing.');
renderStats();
syncCard(cardFlag);
syncCard(cardReview);
syncChips();
buildLine();
buildCaption();
setText(els.line, lineText);
setText(els.caption, captionText);
canvas.setAttribute('aria-label', captionText);
setText(els.mode, modeLabel());
els.dot.className = 'dot ' + modeKey();
document.body.classList.toggle('reduced', state.reduced);
composeMeter();
statsSeen = state.statsRev;
chipSeen = state.chipRev;
sceneSeen = state.sceneRev;
modeSeen = state.modeRev;

glowV = makeGlow(139, 92, 246);
glowA = makeGlow(245, 193, 108);
glowR = makeGlow(240, 113, 120);
glowG = makeGlow(125, 220, 176);
glowSprites = [glowV, glowA, glowR, glowG];
makeDocSprites();
requestAnimationFrame(frame);
</script>
</body>
</html>
